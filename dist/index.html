          <svg class="hero-doodle doodle-left-sparkle" viewBox="0 0 42 42" aria-hidden="true"><path d="M21 3c1.6 10.2 6.8 15.3 17 18-10.2 2.7-15.4 7.8-17 18C18.3 28.8 13.2 23.7 3 21 13.2 18.3 18.3 13.2 21 3Z"/></svg>

            <div class="collection-art art-photos" aria-hidden="true">

            </div>
            <div class="collection-label"><h3>照片</h3><span class="count">03</span><svg aria-hidden="true" class="icon card-arrow"><use href="#arrow-up"/></svg></div>
            <p>拍得好不好不重要，<br />那天很开心就好。</p>
          </button>
          <button class="collection-card" type="button" data-collection="places" aria-label="打开旅行收藏，3 条记录">
            <div class="collection-art art-places" aria-hidden="true">
              <img class="object-art map-art" src="./assets/collection-travel-v3.png" alt="" />
            </div>
            <div class="collection-label"><h3>旅行</h3><span class="count">03</span><svg aria-hidden="true" class="icon card-arrow"><use href="#arrow-up"/></svg></div>
            <p>去过的地方，<br />还有下一次想一起去的。</p>
          </button>
          <button class="collection-card" type="button" data-collection="days" aria-label="打开日常收藏，2 条记录">

              <img class="object-art notes-art" src="./assets/collection-days-v4.png" alt="" />
            </div>
            <div class="collection-label"><h3>日常</h3><span class="count">02</span><svg aria-hidden="true" class="icon card-arrow"><use href="#arrow-up"/></svg></div>
            <p>一顿饭，一首歌，<br />和一些没什么大不了的小事。</p>
          </button>
        </div>

        <div class="recent-list">
          <button class="recent-row" type="button" data-story="sea"><span class="row-number">01</span><div class="recent-thumb photo-thumb"><img src="./assets/shoreline-memory.png" alt="海边散步" loading="lazy" /></div><div class="row-copy"><h3>去海边走了走，风比想象中大</h3><p>没有安排的周末，也很好。</p></div><span class="row-category">照片</span><svg aria-hidden="true" class="icon row-arrow"><use href="#arrow-up"/></svg></button>
          <button class="recent-row" type="button" data-story="train"><span class="row-number">02</span><div class="recent-thumb train-thumb" aria-hidden="true"><svg viewBox="0 0 60 60" fill="none"><rect x="12" y="8" width="36" height="44" rx="10" fill="#fff" stroke="#252620" stroke-width="1.4"/><rect x="16" y="12" width="28" height="26" rx="7" fill="#bfdbcd"/><path d="m16 33 10-9 7 5 7-8 4 5" stroke="#252620" stroke-width="1.4"/><path d="M25 44h10" stroke="#252620" stroke-width="1.4"/></svg></div><div class="row-copy"><h3>下一趟旅行，先定个方向</h3><p>目的地待定，同行的人已经确定。</p></div><span class="row-category">旅行</span><svg aria-hidden="true" class="icon row-arrow"><use href="#arrow-up"/></svg></button>
