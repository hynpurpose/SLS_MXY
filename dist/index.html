<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f1e4" />
  <meta name="description" content="礼物寄存站：跟着夜班站长，寻找影子大盗不小心留下的三条线索。" />
  <title>礼物寄存站 · 2026 生日任务</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./styles.css" />
  <script type="module" src="./script.js"></script>
</head>
<body>
  <main class="game">
    <header class="game-header">
      <div class="game-brand" aria-label="2026 生日任务：礼物寄存站">
        <span class="brand-icon" aria-hidden="true">✳</span>
        <div><span class="brand-kicker">2026 · BIRTHDAY QUEST</span><h1>礼物寄存站</h1></div>
      </div>
      <a class="back-home" href="http://127.0.0.1:5200/" data-home-link>返回首页 <span aria-hidden="true">↗</span></a>
    </header>
    <aside class="progress" aria-label="礼物线索进度">
      <div class="progress-top"><span>礼物线索</span><strong data-progress-count>0 <small>/ 3</small></strong></div>
      <div class="progress-slots" aria-label="三条线索尚未收集" data-progress-slots>
        <span class="progress-slot" data-slot="1" aria-hidden="true">1</span>
        <span class="progress-slot" data-slot="2" aria-hidden="true">2</span>
        <span class="progress-slot" data-slot="3" aria-hidden="true">3</span>
      </div>
      <p>集齐三条，才能打开礼物。</p>
    </aside>

    <div class="world-track" data-world>
      <section class="room intro-room" data-intro-room aria-label="礼物寄存站前台">
    <div class="scene" aria-hidden="true"></div>
    <div class="scene-wash" aria-hidden="true"></div>
    <div class="scene-label" aria-hidden="true"><span>✦</span> 营业中 · 只接收特别的礼物 <span>✦</span></div>
    <figure class="npc" data-npc aria-label="夜班站长，一只拿着钥匙的手绘小猫">
      <img src="./assets/station-cat.png" alt="" width="640" height="960" fetchpriority="high" />
      <figcaption>夜班站长</figcaption>
    </figure>
    <figure class="thief" data-thief hidden aria-label="影子大盗，一个拿着礼物袋的手绘小影子">
      <img src="./assets/shadow-thief.png" alt="" width="960" height="960" decoding="async" />
      <figcaption>影子大盗</figcaption>
    </figure>
    <section class="dialogue" aria-labelledby="dialogue-speaker" data-dialogue>
      <div class="dialogue-head"><span class="speaker" id="dialogue-speaker">夜班站长 <span aria-hidden="true">✳</span></span><span class="line-count" data-line-count>01 / 06</span></div>
      <p class="dialogue-text" data-dialogue-text aria-live="polite" aria-atomic="true"></p>
      <div class="dialogue-foot">
        <span class="dialogue-hint" data-dialogue-hint>点一下，听我慢慢说</span>
        <button class="next-button" type="button" data-next>继续听 <span aria-hidden="true">→</span></button>
      </div>
    </section>
      </section>

      <section class="room search-room" data-search-room inert aria-label="寻找三条线索的房间">
        <div class="search-guide">
          <span>THE SEARCH BEGINS · 3 CLUES</span>
          <h2 tabindex="-1" data-search-title>找找看，哪里不对劲？</h2>
          <p>点开房间里三个可疑的地方。</p>
        </div>
        <button class="clue-marker clue-map" type="button" data-clue="clue-1" aria-label="查看线索一：墙上的地图"><span>01</span><strong>墙上的地图</strong></button>
        <button class="clue-marker clue-items" type="button" data-clue="clue-2" aria-label="查看线索二：地上散落的物品"><span>02</span><strong>散落的物品</strong></button>
        <button class="clue-marker clue-tv" type="button" data-clue="clue-3" aria-label="查看线索三：电视机"><span>03</span><strong>电视机</strong></button>
        <button class="return-station" type="button" data-return>← 返回寄存站</button>
      </section>
    </div>

    <dialog class="clue-dialog" data-clue-dialog aria-labelledby="clue-dialog-title">
      <button class="clue-close" type="button" data-clue-close aria-label="关闭线索提示">×</button>
      <span class="clue-dialog-kicker" data-clue-number>线索 01 / 03</span>
      <h2 id="clue-dialog-title" data-clue-title></h2>
      <p data-clue-description></p>
      <span class="clue-locked">线索尚未解锁</span>
    </dialog>
  </main>
</body>
</html>
